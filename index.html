<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Partidos en vivo</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e141b;
    --card: #172029;
    --text: #eef2f6;
    --muted: #8d9bab;
    --line: #263341;
    --accent: #2bbf84;
    --accent-ink: #06221a;
    --live: #ff6b5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.3;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 14px 40px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; padding: 10px 20px; min-height: 44px;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: wait; }
  #lista { display: grid; gap: 8px; }
  .match {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 12px;
  }
  .liga {
    display: flex; align-items: center; gap: 6px;
    font-size: .74rem; color: var(--muted); margin-bottom: 6px;
  }
  .liga img { width: 14px; height: 14px; object-fit: contain; }
  .cuerpo {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  }
  .team { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; font-size: .92rem; }
  .team.local { justify-content: flex-end; text-align: right; }
  .team img { width: 28px; height: 28px; object-fit: contain; flex: none; }
  .team span { overflow-wrap: anywhere; }
  .centro { text-align: center; min-width: 64px; }
  .marcador { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tiempo {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--live); font-weight: 600; font-size: .75rem;
  }
  .tiempo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
  .tiempo.pausa { color: var(--muted); }
  .tiempo.pausa::before { background: var(--muted); }
  .msg {
    background: var(--card); border: 1px dashed var(--line); border-radius: 12px;
    padding: 22px 14px; text-align: center; color: var(--muted); font-size: .9rem;
  }
  .msg.error { color: var(--live); border-color: var(--live); }
  @media (max-width: 420px) {
    .team { font-size: .82rem; gap: 6px; }
    .team img { width: 24px; height: 24px; }
    .marcador { font-size: 1.15rem; }
    .centro { min-width: 54px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .tiempo::before { animation: pulso 1.6s ease-in-out infinite; }
    @keyframes pulso { 50% { opacity: .35; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>⚽️ J-store live</h1>
      <div class="sub" id="actualizado">Sin consultar todavía</div>
    </div>
    <button id="buscar" type="button">Buscar partidos</button>
  </header>
  <main id="lista" aria-live="polite">
    <div class="msg">Toca “Buscar partidos” para ver eventos destacados en vivo.</div>
  </main>
</div>

<script>
    
  const API_KEY = "e4cb21635e645315d7d07c9445ef669a";
  const TEAM_IDS = [3702, 3700, 3711, 3708, 3707, 3637, 3706, 3704, 15702, 3701, 20252, 17760, 17762, 17743, 15708, 22266, 529, 541, 85, 50, 42, 530, 121, 127, 40, 66, 157, 505, 168, 451, 165, 569, 435, 9568, 2932, 9, 26, 2, 10, 27, 6, 31, 1, 1118, 8, 25];
  
  // Nombres en español. Si un equipo no está aquí, se muestra el nombre original.
  // Para agregar más: "Nombre en inglés": "Nombre en español",
  const NOMBRES = {
    "Italy":"Italia","France":"Francia","Spain":"España","England":"Inglaterra",
    "Croatia":"Croacia","Czech Republic":"Chequia","Germany":"Alemania","Portugal":"Portugal",
    "Netherlands":"Países Bajos","Belgium":"Bélgica","Switzerland":"Suiza","Denmark":"Dinamarca",
    "Sweden":"Suecia","Norway":"Noruega","Poland":"Polonia","Austria":"Austria",
    "Scotland":"Escocia","Wales":"Gales","Ireland":"Irlanda","Northern Ireland":"Irlanda del Norte",
    "Greece":"Grecia","Turkey":"Turquía","Hungary":"Hungría","Serbia":"Serbia",
    "Slovakia":"Eslovaquia","Slovenia":"Eslovenia","Romania":"Rumanía","Ukraine":"Ucrania",
    "Israel":"Israel","Iceland":"Islandia","Finland":"Finlandia","Bulgaria":"Bulgaria",
    "Albania":"Albania","Georgia":"Georgia","Kosovo":"Kosovo","Montenegro":"Montenegro",
    "Luxembourg":"Luxemburgo","Bosnia and Herzegovina":"Bosnia y Herzegovina","Bosnia & Herzegovina":"Bosnia y Herzegovina",
    "North Macedonia":"Macedonia del Norte","Armenia":"Armenia","Azerbaijan":"Azerbaiyán",
    "Belarus":"Bielorrusia","Kazakhstan":"Kazajistán","Cyprus":"Chipre","Estonia":"Estonia",
    "Latvia":"Letonia","Lithuania":"Lituania","Malta":"Malta","Moldova":"Moldavia",
    "Faroe Islands":"Islas Feroe","Andorra":"Andorra","San Marino":"San Marino","Gibraltar":"Gibraltar",
    "Brazil":"Brasil","Argentina":"Argentina","Mexico":"México","USA":"Estados Unidos",
    "United States":"Estados Unidos","Canada":"Canadá","Colombia":"Colombia","Uruguay":"Uruguay",
    "Chile":"Chile","Peru":"Perú","Ecuador":"Ecuador","Paraguay":"Paraguay","Venezuela":"Venezuela",
    "Bolivia":"Bolivia","Costa Rica":"Costa Rica","Panama":"Panamá","Honduras":"Honduras",
    "Jamaica":"Jamaica","Japan":"Japón","South Korea":"Corea del Sur","Australia":"Australia",
    "Morocco":"Marruecos","Egypt":"Egipto","Tunisia":"Túnez","Algeria":"Argelia",
    "Senegal":"Senegal","Nigeria":"Nigeria","Ivory Coast":"Costa de Marfil","Cameroon":"Camerún",
    "Ghana":"Ghana","South Africa":"Sudáfrica","Saudi Arabia":"Arabia Saudita","Iran":"Irán",
    "Qatar":"Catar","Bayern Munich":"Bayern de Múnich","Atletico Madrid":"Atlético de Madrid",
    "Inter":"Inter de Milán","AC Milan":"Milan","Paris Saint Germain":"París Saint-Germain",
    "Sevilla":"Sevilla","Valencia":"Valencia","Real Betis":"Betis"
  };
  const nombre = n => NOMBRES[n] || n;

  const URL_API = "https://v3.football.api-sports.io/fixtures?live=all";
  const lista = document.getElementById("lista");
  const btn = document.getElementById("buscar");
  const actualizado = document.getElementById("actualizado");
  const PAUSAS = { HT: "Descanso", BT: "Pausa", P: "Penales", INT: "Interrumpido", SUSP: "Suspendido" };

  function esc(t) {
    const d = document.createElement("div");
    d.textContent = t ?? "";
    return d.innerHTML;
  }

  function tiempo(f) {
    const s = f.fixture.status;
    if (PAUSAS[s.short]) return { txt: PAUSAS[s.short], pausa: true };
    return { txt: (s.elapsed ?? 0) + "'" + (s.extra ? "+" + s.extra : ""), pausa: false };
  }

  function tarjeta(f) {
    const t = tiempo(f), h = f.teams.home, a = f.teams.away;
    const pais = f.league.country === "World" ? "Mundo" : f.league.country;
    return `
      <article class="match">
        <div class="liga">
          <img src="${esc(f.league.logo)}" alt="" loading="lazy">
          <strong>${esc(f.league.name)}</strong><span>${esc(pais)}</span>
        </div>
        <div class="cuerpo">
          <div class="team local"><span>${esc(nombre(h.name))}</span>
            <img src="${esc(h.logo)}" alt="Escudo de ${esc(nombre(h.name))}" loading="lazy"></div>
          <div class="centro">
            <div class="marcador">${f.goals.home ?? 0} - ${f.goals.away ?? 0}</div>
            <div class="tiempo ${t.pausa ? "pausa" : ""}">${esc(t.txt)}</div>
          </div>
          <div class="team"><img src="${esc(a.logo)}" alt="Escudo de ${esc(nombre(a.name))}" loading="lazy">
            <span>${esc(nombre(a.name))}</span></div>
        </div>
      </article>`;
  }

  async function buscar() {
    btn.disabled = true;
    btn.textContent = "Buscando...";
    try {
      const res = await fetch(URL_API, { headers: { "x-apisports-key": API_KEY } });
      if (!res.ok) throw new Error("Error " + res.status);
      const data = await res.json();
      const errores = data.errors && (Array.isArray(data.errors) ? data.errors : Object.values(data.errors));
      if (errores && errores.length) throw new Error(errores.join(", "));

      const partidos = data.response.filter(f =>
        TEAM_IDS.includes(f.teams.home.id) || TEAM_IDS.includes(f.teams.away.id));

      lista.innerHTML = partidos.length
        ? partidos.map(tarjeta).join("")
        : '<div class="msg">No hay eventos destacados en este momento.</div>';
      actualizado.textContent = "Actualizado a las " +
        new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    } catch (e) {
      lista.innerHTML = '<div class="msg error">No se pudo consultar: ' + esc(e.message) +
        '. Revisa tu KEY y tu conexión.</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = "Buscar partidos";
    }
  }
  btn.addEventListener("click", buscar);
</script>
</body>
</html>
