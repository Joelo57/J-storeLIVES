<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Eventos en Vivo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
}

header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid #222;
}

h1{
    font-size:clamp(22px,2vw,40px);
    margin-bottom:15px;
}

button{
    background:#00a651;
    color:#fff;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
    padding:14px 30px;
    font-size:clamp(16px,1.2vw,24px);
}

button:hover{
    background:#0bbf61;
}

#estado{
    display:block;
    margin-top:12px;
    color:#999;
    font-size:clamp(12px,1vw,18px);
}

#partidos{
    padding:20px;
}

.partido{
    background:#121212;
    border:1px solid #222;
    border-radius:12px;
    margin-bottom:14px;
    padding:18px;

    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

.equipo{
    display:flex;
    align-items:center;
    gap:14px;
}

.equipo.local{
    justify-content:flex-start;
}

.equipo.visitante{
    justify-content:flex-end;
    text-align:right;
}

.logo{
    width:70px;
    height:70px;
    object-fit:contain;
}

.nombre{
    font-weight:600;
    font-size:clamp(14px,1.4vw,28px);
}

.centro{
    text-align:center;
    min-width:180px;
}

.marcador{
    font-size:clamp(30px,3vw,70px);
    font-weight:bold;
    line-height:1;
}

.tiempo{
    color:#00ff66;
    margin-top:8px;
    font-weight:bold;
    font-size:clamp(16px,1.2vw,28px);
}

.sin-partidos{
    text-align:center;
    padding:50px;
    color:#aaa;
    font-size:clamp(16px,1.4vw,28px);
}

.footer{
    position:fixed;
    bottom:10px;
    right:15px;
    color:#666;
    font-size:12px;
}

@media (max-width:900px){

    .logo{
        width:50px;
        height:50px;
    }

    .centro{
        min-width:120px;
    }

    .partido{
        grid-template-columns:1fr;
        text-align:center;
        gap:10px;
    }

    .equipo.local,
    .equipo.visitante{
        justify-content:center;
        text-align:center;
    }
}

</style>
</head>
<body>

<header>

    <h1>⚽ J-store live</h1>

    <button onclick="buscarEventos()">
        🔍 BUSCAR
    </button>

    <span id="estado">
        Presione BUSCAR para consultar.
    </span>

</header>

<div id="partidos">

    <div class="sin-partidos">
        Sin datos cargados.
    </div>

</div>

<div class="footer" id="ultimaActualizacion"></div>

<script>

const API_KEY = "e4cb21635e645315d7d07c9445ef669a";

const MIS_EQUIPOS = [3702, 3700, 3711, 3708, 3707, 3637, 3706, 3704, 15702, 3701, 20252, 17760, 17762, 17743, 15708, 22266, 529, 541, 85, 50, 42, 530, 121, 127, 40, 66, 157, 505, 168, 451, 165, 569, 435, 9568, 2932, 9, 26, 2, 10, 27, 6, 31, 1, 1118, 8, 25];

function esc(txt){
    return String(txt ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[c]);
}

async function buscarEventos(){

    const estado = document.getElementById("estado");
    const contenedor = document.getElementById("partidos");

    estado.textContent = "Consultando API-Football...";
    contenedor.innerHTML = "";

    try{

        const respuesta = await fetch(
            "https://v3.football.api-sports.io/fixtures?live=all",
            {
                method:"GET",
                headers:{
                    "x-apisports-key":API_KEY
                }
            }
        );

        const data = await respuesta.json();

        if(data.errors && Object.keys(data.errors).length > 0){
            throw new Error(Object.values(data.errors).join(" | "));
        }

        const partidos = (data.response || []).filter(partido =>

            MIS_EQUIPOS.includes(partido.teams.home.id) ||
            MIS_EQUIPOS.includes(partido.teams.away.id)

        );

        if(partidos.length === 0){

            contenedor.innerHTML = `
                <div class="sin-partidos">
                    No hay eventos destacados en vivo.
                </div>
            `;

        }else{

            let html = "";

            for(const partido of partidos){

                const local = partido.teams.home;
                const visitante = partido.teams.away;

                const golesLocal = partido.goals.home ?? 0;
                const golesVisitante = partido.goals.away ?? 0;

                const minuto = partido.fixture.status.elapsed;
                const estadoPartido = partido.fixture.status.short;
                const tiempo = minuto != null
                    ? `${minuto}' (${estadoPartido})`
                    : estadoPartido;

                html += `

                    <div class="partido">

                        <div class="equipo local">

                            <img
                                class="logo"
                                src="${esc(local.logo)}"
                                alt="${esc(local.name)}"
                                loading="lazy">

                            <div class="nombre">
                                ${esc(local.name)}
                            </div>

                        </div>

                        <div class="centro">

                            <div class="marcador">
                                ${golesLocal} - ${golesVisitante}
                            </div>

                            <div class="tiempo">
                                ${esc(tiempo)}
                            </div>

                        </div>

                        <div class="equipo visitante">

                            <div class="nombre">
                                ${esc(visitante.name)}
                            </div>

                            <img
                                class="logo"
                                src="${esc(visitante.logo)}"
                                alt="${esc(visitante.name)}"
                                loading="lazy">

                        </div>

                    </div>
                `;

            }

            contenedor.innerHTML = html;

        }

        const ahora = new Date();

        document.getElementById(
            "ultimaActualizacion"
        ).textContent =
            "Última consulta: " +
            ahora.toLocaleTimeString();

        estado.textContent =
            `Consulta completada. Eventos encontrados: ${partidos.length}`;

    }catch(error){

        console.error(error);

        estado.textContent =
            "Error: " + error.message;

        contenedor.innerHTML = `
            <div class="sin-partidos">
                No fue posible obtener datos.
            </div>
        `;
    }
}

</script>

</body>
</html>
